services:
  postgres:
    image: postgres:16-alpine
    container_name: valuecurator-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: valuecurator
      POSTGRES_PASSWORD: valuecurator
      POSTGRES_DB: valuecurator_discovery
    volumes:
      - valuecurator_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valuecurator -d valuecurator_discovery"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  valuecurator_pgdata:
