[package]
name = "proofgate-settlement-lab"
version = "0.1.0"
description = "ValueCurator isolated synthetic Devnet settlement lab"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "proofgate_settlement_lab"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
anchor-spl = { version = "1.2.0", features = ["associated_token"] }
